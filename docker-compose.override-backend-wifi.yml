# Mounts the host's wpa_supplicant control socket directory into the backend
# container so the backend can in turn mount it into the SDK container, which
# the CNET Wi-Fi test cases need to manage Wi-Fi networks on the host.
#
# Do not use this file directly on hosts without wpa_supplicant (e.g. macOS):
# scripts/start.sh adds it automatically only when /var/run/wpa_supplicant exists.
services:
  backend:
    volumes:
      - /var/run/wpa_supplicant:/var/run/wpa_supplicant
